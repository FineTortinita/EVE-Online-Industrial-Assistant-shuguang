name: 功能建议
description: 提出适用于曙光服的功能需求或现有体验改进。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并查看现有功能说明。每个 Issue 聚焦一个需求，便于讨论与跟进。
        本项目仅适用于网易曙光服（Infinity）。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
      description: 描述你正在完成什么操作、当前哪里不方便，以及出现频率。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能或改进
      description: 描述期望如何操作、得到什么结果；可以举一个具体例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代办法
      description: 目前如何处理？已有功能为什么不能满足需求？
  - type: textarea
    id: extra
    attributes:
      label: 补充资料
      description: 可以附示意图、相关 Issue 或参考链接；截图请遮盖个人信息。
